version: 1
applications:
  - appRoot: apps/web-dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g bun
            - cd ../.. && bun install
        build:
          commands:
            - cd ../.. && bun run build --filter=@rsl-cards/web-dashboard
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
