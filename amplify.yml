version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install -g bun
            - bun install
        build:
          commands:
            - cd apps/web-dashboard && bun run build
      artifacts:
        baseDirectory: apps/web-dashboard/.next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
      buildPath: /
    appRoot: apps/web-dashboard
