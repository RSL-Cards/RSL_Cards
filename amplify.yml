version: 1
applications:
  - appRoot: apps/rsl-website
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g bun
            - bun install --force
        build:
          commands:
            - bun run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'

  - appRoot: apps/web-dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g bun
            - bun install --force
        build:
          commands:
            - bun run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
