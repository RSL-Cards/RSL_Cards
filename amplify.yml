version: 1
applications:
  - appRoot: apps/rsl-website
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g bun
            - bun install --production=false
        build:
          commands:
            - bun run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*

  - appRoot: apps/web-dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g bun
            - bun install --production=false
        build:
          commands:
            - bun run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
