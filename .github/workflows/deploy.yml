name: Deploy Production Backend to AWS App Runner

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read  # Required for checkout

jobs:
  deploy:
    name: Build & Deploy Production Backend Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Production Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/rsl-backend-prod:latest
            ${{ steps.login-ecr.outputs.registry }}/rsl-backend-prod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger App Runner Deployment (Prod)
        run: |
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='rsl-backend-prod'].ServiceArn" --output text)
          if [ -z "$SERVICE_ARN" ]; then
            echo "::error::App Runner service 'rsl-backend-prod' not found!"
            exit 1
          fi
          
          echo "Starting App Runner deployment for service ARN: $SERVICE_ARN"
          DEPLOYMENT_ID=$(aws apprunner start-deployment --service-arn "$SERVICE_ARN" --query "OperationId" --output text)
          echo "Deployment initiated with Operation ID: $DEPLOYMENT_ID"
