name: Deploy

on:
  push:
    branches: [develop]
    tags:
      - "v*.*.*"

jobs:
  deploy-qa:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — wire AWS + ECS
        run: |
          echo "QA deploy: build and push ECR images, run migrations, update ECS services, smoke /health, Slack notify."
          echo "Requires secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, ECR_REGISTRY, ECS_CLUSTER_QA, SLACK_WEBHOOK_URL"

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — production gate + staged rollout
        run: |
          echo "Production deploy uses GitHub Environment approval, sequential service updates, rollback on health failure."
          echo "Requires secrets including ECS_CLUSTER_PROD and production AWS resources."
