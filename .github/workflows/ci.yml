name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
        env:
          CI: true
      - run: pnpm turbo lint type-check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rsl_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rslcards_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo test
        env:
          CI: true
          NODE_ENV: test
          LOG_LEVEL: info
          DATABASE_URL: postgresql://rsl_user:password@localhost:5432/rslcards_test
          DATABASE_URL_READ_REPLICA: postgresql://rsl_user:password@localhost:5432/rslcards_test
          REDIS_URL: redis://localhost:6379
          INTERNAL_SERVICE_KEY: ci-internal-service-key-123456789012345678901234567890
          JWT_PRIVATE_KEY: REPLACE_WITH_RS256_PRIVATE_KEY
          JWT_PUBLIC_KEY: REPLACE_WITH_RS256_PUBLIC_KEY
          AUTH_SERVICE_PORT: "3001"
          USER_SERVICE_PORT: "3002"
          INVENTORY_SERVICE_PORT: "3003"
          TRANSACTION_SERVICE_PORT: "3004"
          LISTING_SERVICE_PORT: "3005"
          CARD_DB_SERVICE_PORT: "3006"
          AI_NARRATIVE_SERVICE_PORT: "3007"
          NOTIFICATION_SERVICE_PORT: "3008"
          ANALYTICS_SERVICE_PORT: "3009"
          ADMIN_SERVICE_PORT: "3010"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/transaction-service/coverage/lcov.info
          fail_ci_if_error: false
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - name: Verify service dist folders
        run: |
          for s in auth user inventory transaction listing card-db ai-narrative notification analytics admin; do
            test -d "services/${s}-service/dist" || (echo "missing dist for ${s}-service" && exit 1)
          done

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            auth-service,
            user-service,
            inventory-service,
            transaction-service,
            listing-service,
            card-db-service,
            ai-narrative-service,
            notification-service,
            analytics-service,
            admin-service,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t rsl-${{ matrix.service }}:test .
