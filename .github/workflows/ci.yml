name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install
        env:
          CI: true
      - run: pnpm turbo build --filter="@rsl/shared-*"
      - run: pnpm turbo lint type-check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rsl_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: rsldb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: pnpm install
      - run: pnpm turbo build --filter="@rsl/shared-*"
      - run: pnpm turbo test
        env:
          CI: true
          NODE_ENV: test
          LOG_LEVEL: info
          DATABASE_URL: postgresql://rsl_user:password@localhost:5432/rsldb_test
          TEST_DATABASE_URL: postgresql://rsl_user:password@localhost:5432/rsldb_test
          DATABASE_URL_READ_REPLICA: postgresql://rsl_user:password@localhost:5432/rsldb_test
