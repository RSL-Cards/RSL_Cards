    restart: always

  nginx-qa:
    image: nginx:alpine
    container_name: rsl-nginx-qa
    ports:
      - "4080:80"
    volumes:
      - ../nginx/qa.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - inventory-service
      - transaction-service
      - listing-service
      - card-db-service
      - ai-narrative-service
      - notification-service
      - analytics-service
      - admin-service
    networks:
      - rsl-qa
    restart: always

volumes:
  postgres_qa_data:
  redis_qa_data:

networks:
  rsl-qa:
    driver: bridge
