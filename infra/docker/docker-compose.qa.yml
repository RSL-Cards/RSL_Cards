      NODE_ENV: qa
      LOG_LEVEL: info
    ports:
      - "4003:3000"
    depends_on:
      pgbouncer:
        condition: service_started
      redis-qa:
        condition: service_started
    networks:
      - rsl-qa
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    restart: always

  transaction-service:
