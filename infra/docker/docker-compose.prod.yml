name: rsl-prod

services:
  postgres-prod:
    image: postgres:16-alpine
    container_name: rsl-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rsl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-rslcards_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rsl_user} -d ${POSTGRES_DB:-rslcards_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rsl-prod

  redis-prod:
    image: redis:7-alpine
    container_name: rsl-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    networks:
      - rsl-prod

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: rsl-pgbouncer-prod
    environment:
      DB_HOST: postgres-prod
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-rsl_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DB_NAME: ${POSTGRES_DB:-rslcards_prod}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-150}"
      DEFAULT_POOL_SIZE: "${PGBOUNCER_DEFAULT_POOL_SIZE:-30}"
      ADMIN_USERS: ${POSTGRES_USER:-rsl_user}
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - rsl-prod
    restart: always

  # Single production backend monorepo service serving all modules
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: rsl-backend-prod
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      AUTH_SERVICE_PORT: 3000
      AUTH_GATEWAY_IN_DOCKER: "1"
    ports:
      - "8080:8080"
    depends_on:
      pgbouncer:
        condition: service_started
      redis-prod:
        condition: service_started
    networks:
      - rsl-prod
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    restart: always

  nginx-prod:
    image: nginx:alpine
    container_name: rsl-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - rsl-prod
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  loki:
    image: grafana/loki:latest
    container_name: rsl-loki-prod
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_prod_data:/loki
    networks:
      - rsl-prod
    restart: always

  promtail:
    image: grafana/promtail:latest
    container_name: rsl-promtail-prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - rsl-prod
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: rsl-prometheus-prod
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - rsl-prod
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: rsl-grafana-prod
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus
    networks:
      - rsl-prod
    restart: always

volumes:
  postgres_prod_data:
  redis_prod_data:
  loki_prod_data:
  grafana_prod_data:

networks:
  rsl-prod:
    driver: bridge
