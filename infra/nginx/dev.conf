worker_processes 1;
events { worker_connections 1024; } # max concurrent connections
http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name localhost;

    location = /nginx-health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # ----- rate-limited auth endpoints (with and without /v1 prefix) -----
    location ~ ^(/v1)?/auth/login$ {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://auth-service:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    location ~ ^(/v1)?/auth/register$ {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://auth-service:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    # ----- all other auth routes -----
    location ~ ^(/v1)?/auth/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://auth-service:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }

    # ── ALL API routes → auth-service (JWT gateway) ──────────────────────────
    # auth-service validates JWT (or allows public routes like scan-card),
    # stamps x-user-id, then proxies to the correct downstream microservice
    # via gateway-proxy.ts (GATEWAY_ROUTES config).
    # scan-card is public — the gateway skips JWT for it but still proxies it.
    location ~ ^(/v1)?/(users|inventory|transactions|listings|cards|narratives|notifications|analytics|admin)(/|$) {
      client_max_body_size 20m;
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://auth-service:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
